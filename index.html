const SUPABASE_URL = "https://idxfxmzqbbhbujkzmrqk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hTZgIOJeIpTxK4WRH5Eydg_mGxtKMC8";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Simple key/value storage backed by a single Supabase table called "kv_store".
async function storageGet(key) {
  const { data, error } = await supabase
    .from("kv_store")
    .select("value")
    .eq("key", key)
    .maybeSingle();
  if (error) {
    console.error("storageGet error:", error);
    return null;
  }
  return data ? { key, value: data.value } : null;
}

async function storageSet(key, value) {
  const { error } = await supabase
    .from("kv_store")
    .upsert({ key, value, updated_at: new Date().toISOString() });
  if (error) {
    console.error("storageSet error:", error);
    return null;
  }
  return { key, value };
}

// Lightweight usage analytics — logs a row to a Supabase table called
// "analytics_events". Silently no-ops if that table doesn't exist yet, or
// if this is running in a context with no real Supabase connection (like
// the in-Claude preview). See setup instructions for the table to create.
async function logEvent(eventType, label) {
  try {
    await supabase.from("analytics_events").insert({
      event_type: eventType,
      label: label || null,
    });
  } catch (e) {
    // analytics table not set up yet, or no real backend in this context — ignore
  }
}

// File uploads (demo videos, supporting documents) go into a Supabase
// Storage bucket called "toolbox-uploads". See setup instructions for the
// bucket + policies needed for this to work.
const STORAGE_BUCKET = "toolbox-uploads";

async function uploadFile(file, folder) {
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
  const path = `${folder}/${Date.now()}-${safeName}`;
  const { error: uploadError } = await supabase.storage
    .from(STORAGE_BUCKET)
    .upload(path, file, { upsert: true });
  if (uploadError) {
    console.error("uploadFile error:", uploadError);
    return null;
  }
  const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data && data.publicUrl ? { name: file.name, url: data.publicUrl } : null;
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Opens a print-formatted version of a tool's instructions in a new tab.
// From there, "Save as PDF" in the browser's print dialog produces the file.
// This avoids needing a PDF-generation library.
function exportToolAsPdf(tool) {
  logEvent("tool_pdf_export", tool.name);
  const win = window.open("", "_blank");
  if (!win) {
    alert("Please allow pop-ups for this site to export as PDF.");
    return;
  }
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8" />
<title>${escapeHtml(tool.name)}</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; padding: 48px; color: #000; max-width: 720px; margin: 0 auto; }
  h1 { color: #F58220; font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #53565A; margin: 22px 0 6px; }
  p { font-size: 14px; line-height: 1.65; white-space: pre-wrap; margin: 0; }
  .meta { font-size: 12px; color: #53565A; margin-bottom: 18px; }
  a { color: #2E6F95; word-break: break-all; }
  ul { padding-left: 18px; margin: 4px 0 0; }
  li { font-size: 13.5px; margin-bottom: 4px; }
  @media print { body { padding: 24px; } }
</style></head><body>
<h1>${escapeHtml(tool.name)}</h1>
<div class="meta">${tool.owner ? "Owner: " + escapeHtml(tool.owner) : "Canada Victaulic Team · Sales Tool Box"}</div>
${tool.description ? `<h2>Summary</h2><p>${escapeHtml(tool.description)}</p>` : ""}
${tool.instructions ? `<h2>Instructions</h2><p>${escapeHtml(tool.instructions)}</p>` : ""}
${tool.url ? `<h2>Link</h2><p><a href="${escapeHtml(tool.url)}">${escapeHtml(tool.url)}</a></p>` : ""}
${tool.documents && tool.documents.length ? `<h2>Supporting documents</h2><ul>${tool.documents.map((d) => `<li><a href="${escapeHtml(d.url)}">${escapeHtml(d.name)}</a></li>`).join("")}</ul>` : ""}
${tool.videoUrl ? `<h2>Demo video</h2><p><a href="${escapeHtml(tool.videoUrl)}">${escapeHtml(tool.videoUrl)}</a></p>` : ""}
</body></html>`;
  win.document.open();
  win.document.write(html);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 350);
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---------------------------- Storage hook ---------------------------- */

function useSharedList(key) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const mounted = useRef(true);

  const load = useCallback(async () => {
    try {
      const res = await storageGet(key);
      if (mounted.current) {
        setItems(res && res.value ? JSON.parse(res.value) : []);
        setError(null);
      }
    } catch (e) {
      if (mounted.current) setItems([]);
    } finally {
      if (mounted.current) setLoading(false);
    }
  }, [key]);

  const save = useCallback(async (next) => {
    setItems(next);
    try {
      const res = await storageSet(key, JSON.stringify(next));
      if (!res) setError("Could not save — changes may not persist for others.");
      else setError(null);
    } catch (e) {
      setError("Could not save — changes may not persist for others.");
    }
  }, [key]);

  useEffect(() => {
    mounted.current = true;
    load();
    return () => { mounted.current = false; };
  }, [load]);

  return { items, save, loading, error, reload: load };
}

function CommentRow({ item, depth, onEdit, onDelete, onReply, replyBox }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(item.text);

  const saveEdit = () => {
    if (!draft.trim()) return;
    onEdit(draft.trim());
    setEditing(false);
  };

  return (
    <div style={{
      background: depth > 0 ? COLORS.white : COLORS.gray050,
      border: `1px solid ${COLORS.gray200}`,
      borderRadius: 6, padding: "8px 12px",
      marginLeft: depth > 0 ? 20 : 0,
    }}>
      <div style={{ display: "flex", justifyContent: "space-between", gap: 8, marginBottom: 3 }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: COLORS.gray900 }}>{item.author}</span>
        <span style={{ fontSize: 10.5, color: COLORS.gray300 }}>
          {new Date(item.createdAt).toLocaleDateString()}{item.editedAt ? " · edited" : ""}
        </span>
      </div>

      {editing ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          <textarea
            style={{ ...styles.input, minHeight: 50, resize: "vertical", width: "100%", boxSizing: "border-box" }}
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            autoFocus
          />
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={saveEdit} style={{ ...styles.primaryBtn, padding: "5px 10px", fontSize: 12 }}>Save</button>
            <button onClick={() => { setEditing(false); setDraft(item.text); }} style={{ ...styles.ghostBtn, padding: "5px 10px", fontSize: 12 }}>Cancel</button>
          </div>
        </div>
      ) : (
        <div style={{ fontSize: 13, color: COLORS.gray900, lineHeight: 1.45 }}>{item.text}</div>
      )}

      {!editing && (
        <div style={{ display: "flex", gap: 12, marginTop: 6 }}>
          {depth === 0 && (
            <button
              onClick={onReply}
              style={{ background: "none", border: "none", color: COLORS.info, cursor: "pointer", fontSize: 11.5, fontWeight: 700, padding: 0 }}
            >
              Reply
            </button>
          )}
          <button
            onClick={() => setEditing(true)}
            style={{ background: "none", border: "none", color: COLORS.gray600, cursor: "pointer", fontSize: 11.5, padding: 0 }}
          >
            Edit
          </button>
          <button
            onClick={onDelete}
            style={{ background: "none", border: "none", color: COLORS.blocked, cursor: "pointer", fontSize: 11.5, padding: 0 }}
          >
            Delete
          </button>
        </div>
      )}

      {replyBox}
    </div>
  );
}

function CommentsModal({ title, comments, onUpdate, onClose }) {
  const [author, setAuthor] = useState("");
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [replyTarget, setReplyTarget] = useState(null);
  const [replyText, setReplyText] = useState("");
  const list = comments || [];

  const submit = async () => {
    if (!text.trim()) return;
    setSending(true);
    const newComment = { id: uid(), text: text.trim(), author: author.trim() || "Anonymous", createdAt: new Date().toISOString(), replies: [] };
    await onUpdate([...list, newComment]);
    logEvent("comment_posted", title);
    setText("");
    setSending(false);
  };

  const editComment = (commentId, newText) => {
    onUpdate(list.map((c) => (c.id === commentId ? { ...c, text: newText, editedAt: new Date().toISOString() } : c)));
  };

  const deleteComment = (commentId) => {
    if (!window.confirm("Delete this comment and any replies to it?")) return;
    onUpdate(list.filter((c) => c.id !== commentId));
  };

  const addReply = (commentId) => {
    if (!replyText.trim()) return;
    const newReply = { id: uid(), text: replyText.trim(), author: author.trim() || "Anonymous", createdAt: new Date().toISOString() };
    onUpdate(list.map((c) => (c.id === commentId ? { ...c, replies: [...(c.replies || []), newReply] } : c)));
    logEvent("comment_reply_posted", title);
    setReplyText("");
    setReplyTarget(null);
  };

  const editReply = (commentId, replyId, newText) => {
    onUpdate(list.map((c) => (c.id === commentId
      ? { ...c, replies: (c.replies || []).map((r) => (r.id === replyId ? { ...r, text: newText, editedAt: new Date().toISOString() } : r)) }
      : c)));
  };

  const deleteReply = (commentId, replyId) => {
    if (!window.confirm("Delete this reply?")) return;
    onUpdate(list.map((c) => (c.id === commentId
      ? { ...c, replies: (c.replies || []).filter((r) => r.id !== replyId) }
      : c)));
  };

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 55,
        display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        className="modal-card"
        style={{
          background: COLORS.white, borderRadius: 8, maxWidth: 460, width: "100%",
          padding: 22, display: "flex", flexDirection: "column", gap: 12,
          maxHeight: "80vh",
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 16 }}>Comments</div>
            <div style={{ fontSize: 12, color: COLORS.gray600 }}>{title}</div>
          </div>
          <button onClick={onClose} style={styles.iconBtn}><X size={15} /></button>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8, overflowY: "auto", flex: 1, minHeight: 40 }}>
          {list.length === 0 ? (
            <div style={{ fontSize: 12.5, color: COLORS.gray300, textAlign: "center", padding: "16px 4px" }}>
              No comments yet — be the first.
            </div>
          ) : (
            list.map((c) => (
              <div key={c.id} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <CommentRow
                  item={c}
                  depth={0}
                  onEdit={(newText) => editComment(c.id, newText)}
                  onDelete={() => deleteComment(c.id)}
                  onReply={() => { setReplyTarget(replyTarget === c.id ? null : c.id); setReplyText(""); }}
                  replyBox={replyTarget === c.id ? (
                    <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                      <input
                        style={{ ...styles.input, flex: 1 }}
                        placeholder="Write a reply…"
                        value={replyText}
                        onChange={(e) => setReplyText(e.target.value)}
                        onKeyDown={(e) => { if (e.key === "Enter") addReply(c.id); }}
                        autoFocus
                      />
                      <button onClick={() => addReply(c.id)} style={{ ...styles.primaryBtn, padding: "6px 10px", fontSize: 12 }}>Reply</button>
                    </div>
                  ) : null}
                />
                {(c.replies || []).map((r) => (
                  <CommentRow
                    key={r.id}
                    item={r}
                    depth={1}
                    onEdit={(newText) => editReply(c.id, r.id, newText)}
                    onDelete={() => deleteReply(c.id, r.id)}
                    replyBox={null}
                  />
                ))}
              </div>
            ))
          )}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8, paddingTop: 10, borderTop: `1px solid ${COLORS.gray200}` }}>
          <input
            style={styles.input}
            placeholder="Your name"
            value={author}
            onChange={(e) => setAuthor(e.target.value)}
          />
          <div style={{ display: "flex", gap: 8 }}>
            <input
              style={{ ...styles.input, flex: 1 }}
              placeholder="Add a comment…"
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
            />
            <button onClick={submit} disabled={sending} style={styles.primaryBtn}>
              <MessageCircle size={15} /> Post
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------- Team tab -------------------------------- */

function TeamTab({ projects, team, saveTeam, loading, error, reload }) {
  const [showForm, setShowForm] = useState(false);
  const [name, setName] = useState("");
  const [role, setRole] = useState("Territory Rep");
  const [reportsTo, setReportsTo] = useState("");
  const [saving, setSaving] = useState(false);
  const [confirmCode, setConfirmCode] = useState(null);

  const loadOf = (repName) =>
    projects.filter((p) => p.assignee === repName && p.status !== "Complete").length;

  const managers = team.filter((t) => t.role === "Manager");

  const addMember = async () => {
    if (!name.trim()) return;
    setSaving(true);
    const next = [
      ...team,
      {
        code: uid().slice(0, 6).toUpperCase(),
        name: name.trim(),
        role,
        reportsTo: role === "Manager" ? null : (reportsTo || null),
      },
    ];
    await saveTeam(next);
    setName(""); setRole("Territory Rep"); setReportsTo(""); setShowForm(false); setSaving(false);
  };

  const removeMember = async (repCode) => {
    await saveTeam(team.filter((t) => t.code !== repCode));
  };

  const renderRepCard = (rep) => {
    const active = loadOf(rep.name);
    return (
      <div key={rep.code} style={{
        background: COLORS.white, border: `1px solid ${COLORS.gray200}`,
        borderRadius: 6, padding: "16px 18px", position: "relative",
        borderLeft: `4px solid ${COLORS.orange}`,
      }}>
        <button
          onClick={() => setConfirmCode(rep.code)}
          style={{
            position: "absolute", top: 10, right: 10, background: "none",
            border: "none", color: COLORS.gray300, cursor: "pointer", padding: 2,
          }}
          title="Remove team member"
        >
          <Trash2 size={14} />
        </button>
        <div style={{ fontWeight: 800, fontSize: 15.5, marginBottom: 2 }}>
          {rep.name}
        </div>
        <div style={{ fontSize: 12, color: COLORS.gray600, marginBottom: 10 }}>
          {rep.role}
        </div>
        <div style={{ fontSize: 12.5, color: COLORS.gray900 }}>
          <b>{active}</b> active project{active === 1 ? "" : "s"}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <SectionEyebrow>Team · by manager</SectionEyebrow>
        <button onClick={reload} title="Refresh" style={styles.iconBtn}>
          <RefreshCw size={14} />
        </button>
      </div>

      {error && <div style={styles.errorBanner}>{error}</div>}

      {!showForm ? (
        <button onClick={() => setShowForm(true)} style={{ ...styles.primaryBtn, marginBottom: 18 }}>
          <Plus size={15} /> Add team member
        </button>
      ) : (
        <div style={{ ...styles.formCard, marginBottom: 18 }}>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input
              style={{ ...styles.input, flex: "2 1 180px" }}
              placeholder="Full name"
              value={name}
              onChange={(e) => setName(e.target.value)}
            />
            <select
              style={{ ...styles.input, flex: "1 1 150px" }}
              value={role}
              onChange={(e) => setRole(e.target.value)}
            >
              <option value="Territory Rep">Territory Rep</option>
              <option value="Manager">Manager</option>
            </select>
            {role !== "Manager" && (
              <select
                style={{ ...styles.input, flex: "1 1 160px" }}
                value={reportsTo}
                onChange={(e) => setReportsTo(e.target.value)}
              >
                <option value="">No manager / unassigned</option>
                {managers.map((m) => (
                  <option key={m.code} value={m.name}>Reports to {m.name}</option>
                ))}
              </select>
            )}
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={addMember} disabled={saving} style={styles.primaryBtn}>
              <Plus size={15} /> {saving ? "Saving…" : "Add"}
            </button>
            <button onClick={() => setShowForm(false)} style={styles.ghostBtn}>
              <X size={15} /> Cancel
            </button>
          </div>
        </div>
      )}

      {loading ? (
        <div style={styles.emptyState}>Loading team…</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 26 }}>
          {managers.map((mgr) => {
            const reports = team.filter((t) => t.reportsTo === mgr.name);
            return (
              <div key={mgr.code}>
                <div style={{
                  background: COLORS.white, border: `1px solid ${COLORS.gray200}`,
                  borderRadius: 6, padding: "14px 18px", marginBottom: 14,
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                }}>
                  <div>
                    <div style={{ fontWeight: 800, fontSize: 15 }}>{mgr.name}</div>
                    <div style={{ fontSize: 12.5, color: COLORS.gray600 }}>Team Manager</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <Pill color={COLORS.black}>Manager</Pill>
                    <button
                      onClick={() => setConfirmCode(mgr.code)}
                      style={{ background: "none", border: "none", color: COLORS.gray300, cursor: "pointer", padding: 2 }}
                      title="Remove manager"
                    >
                      <Trash2 size={14} />
                    </button>
                  </div>
                </div>
                {reports.length > 0 && (
                  <div className="team-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14 }}>
                    {reports.map(renderRepCard)}
                  </div>
                )}
              </div>
            );
          })}

          {team.filter((t) => t.role !== "Manager" && !t.reportsTo).length > 0 && (
            <div>
              <SectionEyebrow>Unassigned to a manager</SectionEyebrow>
              <div className="team-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: 14 }}>
                {team.filter((t) => t.role !== "Manager" && !t.reportsTo).map(renderRepCard)}
              </div>
            </div>
          )}
        </div>
      )}

      {confirmCode && (
        <ConfirmModal
          title="Remove this team member?"
          message="Their name stays on any projects or ideas already assigned to them, but they won't appear as an option going forward."
          onCancel={() => setConfirmCode(null)}
          onConfirm={() => { removeMember(confirmCode); setConfirmCode(null); }}
        />
      )}
    </div>
  );
}

/* ----------------------- Projects tab (ideas + projects) ------------------ */

function ProjectsTab({
  ideas, saveIdeas, ideasLoading, ideasError, reloadIdeas,
  projects, saveProjects, projectsLoading, projectsError, reloadProjects,
  team, onSendToToolbox,
}) {
  const [showForm, setShowForm] = useState(false);
  const [title, setTitle] = useState("");
  const [notes, setNotes] = useState("");
  const [assignee, setAssignee] = useState("");
  const [saving, setSaving] = useState(false);
  const [detailItem, setDetailItem] = useState(null); // { kind: 'idea' | 'project', data }
  const [confirmTarget, setConfirmTarget] = useState(null); // { kind, id }
  const [dragIdeaId, setDragIdeaId] = useState(null);
  const [dragOverRep, setDragOverRep] = useState(null);
  const [commentTarget, setCommentTarget] = useState(null); // { kind: 'idea' | 'project', data }

  const IDEA_STAGE = ["New", "Researching", "Proposed"];

  const updateComments = async (kind, id, newComments) => {
    if (kind === "idea") {
      const idea = ideas.find((i) => i.id === id);
      if (!idea) return;
      await saveIdeas(ideas.map((i) => (i.id === id ? { ...i, comments: newComments } : i)));
      setCommentTarget((prev) => (prev && prev.data.id === id ? { ...prev, data: { ...prev.data, comments: newComments } } : prev));
    } else {
      const project = projects.find((p) => p.id === id);
      if (!project) return;
      await saveProjects(projects.map((p) => (p.id === id ? { ...p, comments: newComments } : p)));
      setCommentTarget((prev) => (prev && prev.data.id === id ? { ...prev, data: { ...prev.data, comments: newComments } } : prev));
    }
  };

  const addItem = async () => {
    if (!title.trim()) return;
    setSaving(true);
    if (assignee) {
      const next = [
        {
          id: uid(),
          name: title.trim(),
          desc: notes.trim(),
          assignee,
          status: "In Progress",
          createdAt: new Date().toISOString(),
        },
        ...projects,
      ];
      await saveProjects(next);
    } else {
      const next = [
        {
          id: uid(),
          title: title.trim(),
          direction: notes.trim(),
          assignee: "",
          status: "New",
          sourceBrainstormId: null,
          sourceAuthor: null,
          createdAt: new Date().toISOString(),
        },
        ...ideas,
      ];
      await saveIdeas(next);
    }
    setTitle(""); setNotes(""); setAssignee(""); setShowForm(false); setSaving(false);
  };

  const promoteIdea = async (idea, repName) => {
    await saveIdeas(ideas.filter((i) => i.id !== idea.id));
    const bumpedStatus = IDEA_STAGE.includes(idea.status) ? "In Progress" : idea.status;
    const project = {
      id: idea.id,
      name: idea.title,
      desc: idea.direction,
      assignee: repName,
      status: bumpedStatus,
      createdAt: idea.createdAt,
      sourceIdeaId: idea.id,
    };
    await saveProjects([project, ...projects]);
  };

  const demoteProject = async (project) => {
    await saveProjects(projects.filter((p) => p.id !== project.id));
    const idea = {
      id: project.id,
      title: project.name,
      direction: project.desc,
      assignee: "",
      status: project.status === "Complete" ? "Complete" : "New",
      sourceBrainstormId: null,
      sourceAuthor: null,
      createdAt: project.createdAt,
    };
    await saveIdeas([idea, ...ideas]);
  };

  const updateIdea = async (id, patch) => {
    const idea = ideas.find((i) => i.id === id);
    if (!idea) return;
    if (patch.assignee) {
      await promoteIdea({ ...idea, ...patch }, patch.assignee);
    } else {
      await saveIdeas(ideas.map((i) => (i.id === id ? { ...i, ...patch } : i)));
    }
  };

  const updateProject = async (id, patch) => {
    const project = projects.find((p) => p.id === id);
    if (!project) return;
    if ("assignee" in patch && !patch.assignee) {
      await demoteProject({ ...project, ...patch });
    } else {
      await saveProjects(projects.map((p) => (p.id === id ? { ...p, ...patch } : p)));
    }
  };

  const removeIdea = async (id) => { await saveIdeas(ideas.filter((i) => i.id !== id)); };
  const removeProject = async (id) => { await saveProjects(projects.filter((p) => p.id !== id)); };

  const dragHandlers = {
    onDragStart: (e, id) => { setDragIdeaId(id); e.dataTransfer.effectAllowed = "move"; },
    onDragEnd: () => { setDragIdeaId(null); setDragOverRep(null); },
  };

  const handleDropOnRep = async (repName) => {
    if (dragIdeaId) {
      const idea = ideas.find((i) => i.id === dragIdeaId);
      if (idea) await promoteIdea(idea, repName);
    }
    setDragIdeaId(null);
    setDragOverRep(null);
  };

  const conflicts = {};
  projects.forEach((p) => {
    if (p.assignee && p.status !== "Complete") {
      conflicts[p.assignee] = (conflicts[p.assignee] || 0) + 1;
    }
  });

  const reload = () => { reloadIdeas(); reloadProjects(); };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <SectionEyebrow>Ideas become tools · one pipeline</SectionEyebrow>
        <button onClick={reload} title="Refresh" style={styles.iconBtn}>
          <RefreshCw size={14} />
        </button>
      </div>

      {(ideasError || projectsError) && (
        <div style={styles.errorBanner}>{ideasError || projectsError}</div>
      )}

      {!showForm ? (
        <button onClick={() => setShowForm(true)} style={styles.primaryBtn}>
          <Plus size={15} /> Add tool idea
        </button>
      ) : (
        <div style={styles.formCard}>
          <input
            style={styles.input}
            placeholder="Title (e.g. Lot 7 valve package quoting)"
            value={title}
            onChange={(e) => setTitle(e.target.value)}
          />
          <textarea
            style={{ ...styles.input, minHeight: 60, resize: "vertical" }}
            placeholder="Notes / direction (optional)"
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
          />
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <select
              style={{ ...styles.input, flex: 1, minWidth: 160 }}
              value={assignee}
              onChange={(e) => setAssignee(e.target.value)}
            >
              <option value="">Leave as an idea (unassigned)</option>
              {team.map((t) => (
                <option key={t.code} value={t.name}>Assign to {t.name}</option>
              ))}
            </select>
            <button onClick={addItem} disabled={saving} style={styles.primaryBtn}>
              <Plus size={15} /> {saving ? "Saving…" : "Create"}
            </button>
            <button onClick={() => setShowForm(false)} style={styles.ghostBtn}>
              <X size={15} /> Cancel
            </button>
          </div>
        </div>
      )}

      {/* --------------------------- Ideas section --------------------------- */}
      <div style={{ marginTop: 22 }}>
        <SectionEyebrow>Tool ideas · not yet assigned</SectionEyebrow>
        {ideasLoading ? (
          <div style={styles.emptyState}>Loading ideas…</div>
        ) : ideas.length === 0 ? (
          <div style={styles.emptyState}>No open ideas. Add one above, or promote one from Brainstorm.</div>
        ) : (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
            {ideas.map((idea) => (
              <IdeaCard
                key={idea.id}
                idea={idea}
                team={team}
                onOpenDetails={() => setDetailItem({ kind: "idea", data: idea })}
                onRemove={() => setConfirmTarget({ kind: "idea", id: idea.id })}
                onAssign={(repName) => updateIdea(idea.id, { assignee: repName })}
                onComment={() => setCommentTarget({ kind: "idea", data: idea })}
                dragHandlers={dragHandlers}
              />
            ))}
          </div>
        )}
      </div>

      {ideas.length > 0 && (
        <div style={{ margin: "16px 0 24px" }}>
          <div style={{ fontSize: 11.5, color: COLORS.gray600, marginBottom: 8 }}>
            Drag an idea card onto a rep to send it to Projects:
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {team.filter((t) => t.role !== "Manager").map((rep) => {
              const isOver = dragOverRep === rep.name;
              return (
                <div
                  key={rep.code}
                  onDragOver={(e) => { e.preventDefault(); setDragOverRep(rep.name); }}
                  onDragLeave={() => setDragOverRep((c) => (c === rep.name ? null : c))}
                  onDrop={(e) => { e.preventDefault(); handleDropOnRep(rep.name); }}
                  style={{
                    padding: "8px 14px", borderRadius: 999, fontSize: 12.5, fontWeight: 700,
                    background: isOver ? "#FFF3E8" : COLORS.gray050,
                    border: `1.5px dashed ${isOver ? COLORS.orange : COLORS.gray200}`,
                    color: isOver ? COLORS.orange : COLORS.gray900, transition: "all 0.1s ease",
                  }}
                >
                  {rep.name}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* -------------------------- Projects section -------------------------- */}
      <div style={{ marginTop: 26 }}>
        <SectionEyebrow>In progress · who's working on what</SectionEyebrow>
        {projectsLoading ? (
          <div style={styles.emptyState}>Loading projects…</div>
        ) : projects.length === 0 ? (
          <div style={styles.emptyState}>No assigned projects yet. Assign an idea above to start the list.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {projects.map((p) => {
              const statusMeta = WORK_STATUSES.find((s) => s.key === p.status) || WORK_STATUSES[0];
              const overloaded = p.assignee && conflicts[p.assignee] > 2 && p.status !== "Complete";
              return (
                <div key={p.id} className="proj-row" style={styles.projectRow}>
                  <div style={{ flex: 1, minWidth: 200 }}>
                    <div style={{ fontWeight: 700, fontSize: 14.5 }}>{p.name}</div>
                    {p.desc && (
                      <div style={{ fontSize: 12.5, color: COLORS.gray600, marginTop: 2 }}>{p.desc}</div>
                    )}
                    {overloaded && (
                      <div style={{ fontSize: 11.5, color: COLORS.pending, marginTop: 3, fontWeight: 700 }}>
                        Heads up: {p.assignee} has {conflicts[p.assignee]} active projects
                      </div>
                    )}
                  </div>

                  <select
                    className="proj-select"
                    value={p.assignee}
                    onChange={(e) => updateProject(p.id, { assignee: e.target.value })}
                    style={{ ...styles.input, width: 160 }}
                  >
                    <option value="">Send back to Ideas</option>
                    {team.map((t) => (
                      <option key={t.code} value={t.name}>{t.name}</option>
                    ))}
                  </select>

                  <select
                    className="proj-select"
                    value={p.status}
                    onChange={(e) => updateProject(p.id, { status: e.target.value })}
                    style={{ ...styles.input, width: 140, color: statusMeta.color, fontWeight: 700 }}
                  >
                    {WORK_STATUSES.map((s) => (
                      <option key={s.key} value={s.key}>{s.key}</option>
                    ))}
                  </select>

                  <div className="proj-row-actions" style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setCommentTarget({ kind: "project", data: p })} style={{ ...styles.iconBtn, position: "relative" }} title="Comments">
                      <MessageCircle size={14} />
                      {p.comments && p.comments.length > 0 && (
                        <span style={styles.commentBadge}>{p.comments.length}</span>
                      )}
                    </button>

                    <button onClick={() => onSendToToolbox(p)} style={styles.iconBtn} title="Send to Toolbox">
                      <Archive size={14} />
                    </button>

                    <button onClick={() => setDetailItem({ kind: "project", data: p })} style={styles.iconBtn} title="Edit tool idea">
                      <Edit2 size={14} />
                    </button>

                    <button onClick={() => setConfirmTarget({ kind: "project", id: p.id })} style={styles.iconBtn} title="Delete tool idea">
                      <Trash2 size={15} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {detailItem && (
        <ItemDetailModal
          kind={detailItem.kind}
          item={detailItem.data}
          team={team}
          onClose={() => setDetailItem(null)}
          onSave={(id, patch) => (detailItem.kind === "idea" ? updateIdea(id, patch) : updateProject(id, patch))}
        />
      )}

      {confirmTarget && (
        <ConfirmModal
          title={confirmTarget.kind === "idea" ? "Delete this tool idea?" : "Delete this tool?"}
          message="This removes it from the shared board for everyone on the team."
          onCancel={() => setConfirmTarget(null)}
          onConfirm={() => {
            if (confirmTarget.kind === "idea") removeIdea(confirmTarget.id);
            else removeProject(confirmTarget.id);
            setConfirmTarget(null);
          }}
        />
      )}

      {commentTarget && (
        <CommentsModal
          title={commentTarget.kind === "idea" ? commentTarget.data.title : commentTarget.data.name}
          comments={commentTarget.data.comments}
          onUpdate={(newComments) => updateComments(commentTarget.kind, commentTarget.data.id, newComments)}
          onClose={() => setCommentTarget(null)}
        />
      )}
    </div>
  );
}

function ItemDetailModal({ kind, item, team, onClose, onSave }) {
  const isIdea = kind === "idea";
  const [title, setTitle] = useState((isIdea ? item.title : item.name) || "");
  const [notes, setNotes] = useState((isIdea ? item.direction : item.desc) || "");
  const [assignee, setAssignee] = useState(item.assignee || "");
  const [status, setStatus] = useState(item.status || "New");

  const save = async () => {
    if (!title.trim()) return;
    const patch = isIdea
      ? { title: title.trim(), direction: notes.trim(), assignee, status }
      : { name: title.trim(), desc: notes.trim(), assignee, status };
    await onSave(item.id, patch);
    onClose();
  };

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 50,
        display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        className="modal-card"
        style={{
          background: COLORS.white, borderRadius: 8, maxWidth: 480, width: "100%",
          padding: 24, display: "flex", flexDirection: "column", gap: 12,
          maxHeight: "85vh", overflowY: "auto",
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ fontWeight: 800, fontSize: 17 }}>
            {isIdea ? "Edit tool idea" : "Edit tool idea"}
          </div>
          <button onClick={onClose} style={styles.iconBtn}><X size={15} /></button>
        </div>

        {isIdea && item.sourceAuthor && (
          <div style={{ fontSize: 11.5, color: COLORS.gray600, fontStyle: "italic" }}>
            Originally posted by {item.sourceAuthor} on the Brainstorm board
          </div>
        )}

        <div>
          <div style={styles.fieldLabel}>Title</div>
          <input
            style={{ ...styles.input, width: "100%", boxSizing: "border-box" }}
            value={title}
            onChange={(e) => setTitle(e.target.value)}
          />
        </div>

        <div>
          <div style={styles.fieldLabel}>Notes / direction</div>
          <textarea
            style={{ ...styles.input, minHeight: 100, resize: "vertical", width: "100%", boxSizing: "border-box" }}
            placeholder="Where do we want this to go? Scope, target account, next steps…"
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
          />
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={styles.fieldLabel}>Assigned to</div>
            <select
              style={{ ...styles.input, width: "100%", boxSizing: "border-box" }}
              value={assignee}
              onChange={(e) => setAssignee(e.target.value)}
            >
              <option value="">Unassigned (idea stage)</option>
              {team.map((t) => (
                <option key={t.code} value={t.name}>{t.name}</option>
              ))}
            </select>
          </div>
          <div style={{ flex: 1 }}>
            <div style={styles.fieldLabel}>Status</div>
            <select
              style={{ ...styles.input, width: "100%", boxSizing: "border-box" }}
              value={status}
              onChange={(e) => setStatus(e.target.value)}
            >
              {WORK_STATUSES.map((s) => (
                <option key={s.key} value={s.key}>{s.key}</option>
              ))}
            </select>
          </div>
        </div>

        <div style={{ fontSize: 11.5, color: COLORS.gray600 }}>
          {assignee ? "Saving with a rep assigned moves this into Projects." : "Saving with no rep keeps this in Project Ideas."}
        </div>

        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 6 }}>
          <button onClick={onClose} style={styles.ghostBtn}>Cancel</button>
          <button onClick={save} style={styles.primaryBtn}><CheckCircle2 size={15} /> Save</button>
        </div>
      </div>
    </div>
  );
}

function ToolboxTab({ tools, saveTools, completedProjects, loading, error, reload }) {
  const [showForm, setShowForm] = useState(false);
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const [problem, setProblem] = useState("");
  const [instructions, setInstructions] = useState("");
  const [url, setUrl] = useState("");
  const [owner, setOwner] = useState("");
  const [toolType, setToolType] = useState("Other");
  const [videoFile, setVideoFile] = useState(null);
  const [docFiles, setDocFiles] = useState([]);
  const [fromProject, setFromProject] = useState("");
  const [saving, setSaving] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const [editTool, setEditTool] = useState(null);
  const [viewMode, setViewMode] = useState(
    () => localStorage.getItem("toolbox-view-mode") || "detailed"
  );
  const [viewTool, setViewTool] = useState(null);
  const [commentTool, setCommentTool] = useState(null);

  const setMode = (mode) => {
    setViewMode(mode);
    localStorage.setItem("toolbox-view-mode", mode);
  };

  const groupedTools = TOOL_TYPES.map((type) => ({
    type,
    items: tools.filter((t) => (t.toolType || "Other") === type),
  })).filter((g) => g.items.length > 0);

  const updateToolComments = async (id, newComments) => {
    const tool = tools.find((t) => t.id === id);
    if (!tool) return;
    await saveTools(tools.map((t) => (t.id === id ? { ...t, comments: newComments } : t)));
    setCommentTool((prev) => (prev && prev.id === id ? { ...prev, comments: newComments } : prev));
  };

  const resetForm = () => {
    setName(""); setDescription(""); setProblem(""); setInstructions("");
    setUrl(""); setOwner(""); setToolType("Other"); setVideoFile(null); setDocFiles([]);
    setFromProject(""); setShowForm(false);
  };

  const addTool = async () => {
    if (!name.trim()) return;
    setSaving(true);

    let videoUrl = "";
    if (videoFile) {
      const uploaded = await uploadFile(videoFile, "videos");
      if (uploaded) videoUrl = uploaded.url;
    }
    const documents = [];
    for (const f of docFiles) {
      const uploaded = await uploadFile(f, "documents");
      if (uploaded) documents.push(uploaded);
    }

    const next = [
      {
        id: uid(),
        name: name.trim(),
        description: description.trim(),
        problem: problem.trim(),
        instructions: instructions.trim(),
        url: url.trim(),
        owner: owner.trim(),
        toolType,
        videoUrl,
        documents,
        sourceProject: fromProject || null,
        addedAt: new Date().toISOString(),
      },
      ...tools,
    ];
    await saveTools(next);
    resetForm();
    setSaving(false);
  };

  const updateTool = async (id, patch) => {
    await saveTools(tools.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  };

  const removeTool = async (id) => {
    await saveTools(tools.filter((t) => t.id !== id));
  };

  const promoteFromProject = async (projectId, projectName) => {
    setShowForm(true);
    setName(projectName);
    setFromProject(projectId);
    setDescription("");
    setProblem("");
    setInstructions("");
    setUrl("");
    setOwner("");
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 10 }}>
        <SectionEyebrow>Toolbox · reusable tools and outputs from completed work</SectionEyebrow>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <div style={{ display: "flex", border: `1px solid ${COLORS.gray200}`, borderRadius: 6, overflow: "hidden" }}>
            <button
              onClick={() => setMode("detailed")}
              style={styles.viewModeBtn(viewMode === "detailed")}
              title="Full detail cards"
            >
              <Eye size={13} /> Detailed
            </button>
            <button
              onClick={() => setMode("simple")}
              style={styles.viewModeBtn(viewMode === "simple")}
              title="Just names and links"
            >
              <EyeOff size={13} /> Simple List
            </button>
          </div>
          <button onClick={reload} title="Refresh" style={styles.iconBtn}>
            <RefreshCw size={14} />
          </button>
        </div>
      </div>

      {error && <div style={styles.errorBanner}>{error}</div>}

      {!showForm ? (
        <button onClick={() => setShowForm(true)} style={styles.primaryBtn}>
          <Plus size={15} /> Add to toolbox
        </button>
      ) : (
        <div style={styles.formCard}>
          <input
            style={styles.input}
            placeholder="Tool or template name"
            value={name}
            onChange={(e) => setName(e.target.value)}
          />
          <div>
            <div style={styles.fieldLabel}>Tool type</div>
            <select
              style={{ ...styles.input, width: "100%", boxSizing: "border-box", cursor: "pointer" }}
              value={toolType}
              onChange={(e) => setToolType(e.target.value)}
            >
              {TOOL_TYPES.map((t) => (
                <option key={t} value={t}>{t}</option>
              ))}
            </select>
          </div>
          <div>
            <div style={styles.fieldLabel}>Summary</div>
            <textarea
              style={{ ...styles.input, minHeight: 50, resize: "vertical", width: "100%", boxSizing: "border-box" }}
              placeholder="What is this, in a sentence? (shown on the tool card)"
              value={description}
              onChange={(e) => setDescription(e.target.value)}
            />
          </div>
          <div>
            <div style={styles.fieldLabel}>Instructions</div>
            <textarea
              style={{ ...styles.input, minHeight: 60, resize: "vertical", width: "100%", boxSizing: "border-box" }}
              placeholder="How does someone actually use this?"
              value={instructions}
              onChange={(e) => setInstructions(e.target.value)}
            />
          </div>
          <input
            style={styles.input}
            placeholder="Link to tool, template, or documentation (https://…)"
            value={url}
            onChange={(e) => setUrl(e.target.value)}
          />
          <input
            style={styles.input}
            placeholder="Owner name"
            value={owner}
            onChange={(e) => setOwner(e.target.value)}
          />

          <div>
            <div style={styles.fieldLabel}>Demo video (optional)</div>
            <label style={styles.fileLabel}>
              <Video size={14} />
              {videoFile ? videoFile.name : "Choose a video file"}
              <input
                type="file"
                accept="video/*"
                style={{ display: "none" }}
                onChange={(e) => setVideoFile(e.target.files[0] || null)}
              />
            </label>
          </div>

          <div>
            <div style={styles.fieldLabel}>Supporting documents (optional)</div>
            <label style={styles.fileLabel}>
              <Paperclip size={14} />
              {docFiles.length > 0 ? `${docFiles.length} file(s) selected` : "Choose files"}
              <input
                type="file"
                multiple
                style={{ display: "none" }}
                onChange={(e) => setDocFiles(Array.from(e.target.files || []))}
              />
            </label>
          </div>

          {fromProject && (
            <div style={{ fontSize: 12, color: COLORS.gray600, fontStyle: "italic" }}>
              From completed project: <b>{fromProject}</b>
            </div>
          )}
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button onClick={addTool} disabled={saving} style={styles.primaryBtn}>
              {saving ? <Loader2 size={15} className="spin" /> : <Plus size={15} />}
              {saving ? "Uploading & saving…" : "Add to toolbox"}
            </button>
            <button onClick={resetForm} style={styles.ghostBtn}>
              <X size={15} /> Cancel
            </button>
          </div>
        </div>
      )}

      {completedProjects.length > 0 && (
        <div style={{ marginTop: 20, marginBottom: 20 }}>
          <SectionEyebrow>Recently completed tool ideas</SectionEyebrow>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {completedProjects.map((p) => (
              <div key={p.id} style={{
                background: COLORS.white, border: `1px solid ${COLORS.gray200}`,
                borderLeft: `4px solid ${COLORS.success}`, borderRadius: 6,
                padding: "12px 14px", display: "flex", gap: 12, alignItems: "center", justifyContent: "space-between",
              }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{p.name}</div>
                  {p.desc && (
                    <div style={{ fontSize: 12.5, color: COLORS.gray600, marginTop: 2 }}>{p.desc}</div>
                  )}
                </div>
                <button
                  onClick={() => promoteFromProject(p.id, p.name)}
                  style={styles.primaryBtn}
                >
                  <BookOpen size={15} /> Add to toolbox
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ marginTop: 18 }}>
        <SectionEyebrow style={{ marginBottom: 10 }}>Tool</SectionEyebrow>
        {loading ? (
          <div style={styles.emptyState}>Loading toolbox…</div>
        ) : tools.length === 0 ? (
          <div style={styles.emptyState}>
            No tools yet. Add one manually above, or promote a completed project.
          </div>
        ) : viewMode === "simple" ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
            {groupedTools.map((group) => (
              <div key={group.type}>
                <div style={{
                  fontSize: 11.5, fontWeight: 800, color: COLORS.gray600,
                  textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 8,
                }}>
                  {group.type}
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {group.items.map((tool) => (
                    <div key={tool.id} style={{
                      background: COLORS.white, border: `1px solid ${COLORS.gray200}`,
                      borderLeft: `3px solid ${COLORS.orange}`, borderRadius: 6,
                      padding: "10px 14px", display: "flex", gap: 12, alignItems: "center", justifyContent: "space-between",
                    }}>
                      <div style={{ fontWeight: 700, fontSize: 14, flex: 1 }}>{tool.name}</div>
                      <button
                        onClick={() => setCommentTool(tool)}
                        style={{ ...styles.iconBtn, position: "relative" }}
                        title="Comments"
                      >
                        <MessageCircle size={14} />
                        {tool.comments && tool.comments.length > 0 && (
                          <span style={styles.commentBadge}>{tool.comments.length}</span>
                        )}
                      </button>
                      {tool.url ? (
                        <a
                          href={tool.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          onClick={() => logEvent("tool_open", tool.name)}
                          style={{ color: COLORS.info, textDecoration: "none", fontSize: 13, fontWeight: 700, whiteSpace: "nowrap" }}
                        >
                          Open tool ↗
                        </a>
                      ) : (

function ToolDetailModal({ tool, onClose, onSave }) {
  const [name, setName] = useState(tool.name || "");
  const [description, setDescription] = useState(tool.description || "");
  const [problem, setProblem] = useState(tool.problem || "");
  const [instructions, setInstructions] = useState(tool.instructions || "");
  const [url, setUrl] = useState(tool.url || "");
  const [owner, setOwner] = useState(tool.owner || "");
  const [toolType, setToolType] = useState(tool.toolType || "Other");
  const [videoUrl, setVideoUrl] = useState(tool.videoUrl || "");
  const [videoFile, setVideoFile] = useState(null);
  const [documents, setDocuments] = useState(tool.documents || []);
  const [newDocFiles, setNewDocFiles] = useState([]);
  const [saving, setSaving] = useState(false);

  const removeDoc = (index) => {
    setDocuments((docs) => docs.filter((_, i) => i !== index));
  };

  const save = async () => {
    if (!name.trim()) return;
    setSaving(true);

    let finalVideoUrl = videoUrl;
    if (videoFile) {
      const uploaded = await uploadFile(videoFile, "videos");
      if (uploaded) finalVideoUrl = uploaded.url;
    }
    const uploadedDocs = [];
    for (const f of newDocFiles) {
      const uploaded = await uploadFile(f, "documents");
      if (uploaded) uploadedDocs.push(uploaded);
    }

    await onSave(tool.id, {
      name: name.trim(),
      description: description.trim(),
      problem: problem.trim(),
      instructions: instructions.trim(),
      url: url.trim(),
      owner: owner.trim(),
      toolType,
      videoUrl: finalVideoUrl,
      documents: [...documents, ...uploadedDocs],
    });
    setSaving(false);
    onClose();
  };

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 50,
        display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        className="modal-card"
        style={{
          background: COLORS.white, borderRadius: 8, maxWidth: 480, width: "100%",
          padding: 24, display: "flex", flexDirection: "column", gap: 12,
          maxHeight: "85vh", overflowY: "auto",
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ fontWeight: 800, fontSize: 17 }}>Edit tool</div>
          <button onClick={onClose} style={styles.iconBtn}><X size={15} /></button>
        </div>

        <div>
          <div style={styles.fieldLabel}>Tool or template name</div>
          <input
            style={{ ...styles.input, width: "100%", boxSizing: "border-box" }}
            value={name}
            onChange={(e) => setName(e.target.value)}
          />
        </div>

        <div>
          <div style={styles.fieldLabel}>Tool type</div>
          <select
            style={{ ...styles.input, width: "100%", boxSizing: "border-box", cursor: "pointer" }}
            value={toolType}
            onChange={(e) => setToolType(e.target.value)}
          >
            {TOOL_TYPES.map((t) => (
              <option key={t} value={t}>{t}</option>
            ))}
          </select>
        </div>

        <div>
          <div style={styles.fieldLabel}>Summary</div>
          <textarea
            style={{ ...styles.input, minHeight: 60, resize: "vertical", width: "100%", boxSizing: "border-box" }}
            value={description}
            onChange={(e) => setDescription(e.target.value)}
          />
        </div>

        <div>
          <div style={styles.fieldLabel}>Instructions</div>
          <textarea
            style={{ ...styles.input, minHeight: 70, resize: "vertical", width: "100%", boxSizing: "border-box" }}
            value={instructions}
            onChange={(e) => setInstructions(e.target.value)}
          />
        </div>

        <div>
          <div style={styles.fieldLabel}>Link</div>
          <input
            style={{ ...styles.input, width: "100%", boxSizing: "border-box" }}
            placeholder="https://…"
            value={url}
            onChange={(e) => setUrl(e.target.value)}
          />
        </div>

        <div>
          <div style={styles.fieldLabel}>Owner name</div>
          <input
            style={{ ...styles.input, width: "100%", boxSizing: "border-box" }}
            value={owner}
            onChange={(e) => setOwner(e.target.value)}
          />
        </div>

        <div>
          <div style={styles.fieldLabel}>Demo video</div>
          {videoUrl && !videoFile && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <a href={videoUrl} target="_blank" rel="noopener noreferrer" style={{ fontSize: 12.5, color: COLORS.info }}>
                Current video ↗
              </a>
              <button onClick={() => setVideoUrl("")} style={{ ...styles.ghostBtn, padding: "3px 8px", fontSize: 11 }}>
                Remove
              </button>
            </div>
          )}
          <label style={styles.fileLabel}>
            <Video size={14} />
            {videoFile ? videoFile.name : "Replace video file"}
            <input
              type="file"
              accept="video/*"
              style={{ display: "none" }}
              onChange={(e) => setVideoFile(e.target.files[0] || null)}
            />
          </label>
        </div>

        <div>
          <div style={styles.fieldLabel}>Supporting documents</div>
          {documents.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 6 }}>
              {documents.map((doc, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5 }}>
                  <a href={doc.url} target="_blank" rel="noopener noreferrer" style={{ color: COLORS.info, flex: 1 }}>
                    {doc.name}
                  </a>
                  <button onClick={() => removeDoc(i)} style={{ ...styles.ghostBtn, padding: "3px 8px", fontSize: 11 }}>
                    Remove
                  </button>
                </div>
              ))}
            </div>
          )}
          <label style={styles.fileLabel}>
            <Paperclip size={14} />
            {newDocFiles.length > 0 ? `${newDocFiles.length} new file(s) selected` : "Add more documents"}
            <input
              type="file"
              multiple
              style={{ display: "none" }}
              onChange={(e) => setNewDocFiles(Array.from(e.target.files || []))}
            />
          </label>
        </div>

        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 6 }}>
          <button onClick={onClose} style={styles.ghostBtn}>Cancel</button>
          <button onClick={save} disabled={saving} style={styles.primaryBtn}>
            {saving ? <Loader2 size={15} className="spin" /> : <CheckCircle2 size={15} />}
            {saving ? "Uploading & saving…" : "Save"}
          </button>
        </div>
      </div>
    </div>
  );
}

const TABS = [
  { key: "ai", label: "AI Guide", Icon: Sparkles },
  { key: "team", label: "Team", Icon: Users },
  { key: "projects", label: "Tool Ideas", Icon: FolderKanban },
  { key: "toolbox", label: "Toolbox", Icon: Archive },
];

function App() {
  const [tab, setTab] = useState("ai");
  const projectsStore = useSharedList("victaulic-yvr-pha-projects");
  const ideasStore = useSharedList("victaulic-yvr-pha-ideas");
  const toolboxStore = useSharedList("victaulic-yvr-pha-toolbox");
  const teamStore = useSharedList("victaulic-yvr-pha-team");
  const seededTeam = useRef(false);
  const seededIdeas = useRef(false);
  const seededTools = useRef(false);

  // Log a lightweight view event every time the visible tab changes
  // (including the initial load), for basic usage analytics.
  useEffect(() => {
    logEvent("tab_view", tab);
  }, [tab]);

  // Seed the shared team roster. If the store is brand new, seed everything.
  // If it already has data (the normal case), merge in any DEFAULT_TEAM
  // members whose code isn't already present — this is what makes newly
  // added team members/managers show up for everyone automatically,
  // without needing to re-add them by hand on the live site.
  useEffect(() => {
    if (teamStore.loading || seededTeam.current) return;
    seededTeam.current = true;

    if (teamStore.items.length === 0) {
      teamStore.save(DEFAULT_TEAM);
    } else {
      const existingCodes = new Set(teamStore.items.map((m) => m.code));
      const missing = DEFAULT_TEAM.filter((m) => !existingCodes.has(m.code));
      if (missing.length > 0) {
        teamStore.save([...teamStore.items, ...missing]);
      }
    }
  }, [teamStore.loading, teamStore.items.length]);

  // Seed the project ideas board with the standard toolbuilds the first time it's empty.
  useEffect(() => {
    if (!ideasStore.loading && ideasStore.items.length === 0 && !seededIdeas.current) {
      seededIdeas.current = true;
      const seeded = DEFAULT_IDEAS.map((d) => ({
        id: uid(),
        title: d.title,
        direction: d.direction,
        assignee: "",
        status: "New",
        sourceBrainstormId: null,
        sourceAuthor: null,
        createdAt: new Date().toISOString(),
      }));
      ideasStore.save(seeded);
    }
  }, [ideasStore.loading, ideasStore.items.length]);

  // Seed the toolbox with tools already built and live. If the store is
  // brand new, seed everything. If it already has data (the normal case),
  // instead merge in any DEFAULT_TOOLS entries whose URL isn't already
  // present — this is what makes newly-added default tools show up for
  // everyone automatically, without needing to re-add them by hand.
  useEffect(() => {
    if (toolboxStore.loading || seededTools.current) return;
    seededTools.current = true;

    const makeToolRecord = (t) => ({
      id: uid(),
      name: t.name,
      description: t.description,
      problem: t.problem || "",
      instructions: t.instructions || "",
      url: t.url,
      owner: t.owner || "",
      toolType: t.toolType || "Other",
      videoUrl: "",
      documents: [],
      comments: [],
      sourceProject: null,
      addedAt: new Date().toISOString(),
    });

    if (toolboxStore.items.length === 0) {
      toolboxStore.save(DEFAULT_TOOLS.map(makeToolRecord));
    } else {
      const existingUrls = new Set(
        toolboxStore.items.map((t) => (t.url || "").trim().toLowerCase()).filter(Boolean)
      );
      const missing = DEFAULT_TOOLS.filter(
        (t) => t.url && !existingUrls.has(t.url.trim().toLowerCase())
      );
      if (missing.length > 0) {
        toolboxStore.save([...toolboxStore.items, ...missing.map(makeToolRecord)]);
      }
    }
  }, [toolboxStore.loading, toolboxStore.items.length]);

  const team = teamStore.items.length > 0 ? teamStore.items : DEFAULT_TEAM;

  const sendProjectToToolbox = async (project) => {
    const next = [
      {
        id: uid(),
        name: project.name,
        description: project.desc || "",
        problem: "",
        instructions: "",
        url: "",
        owner: project.assignee || "",
        toolType: "Other",
        videoUrl: "",
        documents: [],
        sourceProject: project.name,
        addedAt: new Date().toISOString(),
      },
      ...toolboxStore.items,
    ];
    await toolboxStore.save(next);
    setTab("toolbox");
  };

  return (
    <div style={{
      minHeight: "100vh", background: COLORS.gray050,
      fontFamily: "Arial, Helvetica, sans-serif",
    }}>
      <style>{`
        @media (max-width: 720px) {
          .ai-grid { grid-template-columns: 1fr !important; }
          .triple-grid { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 640px) {
          .app-header-inner, .app-nav, .app-main { padding-left: 16px !important; padding-right: 16px !important; }
          .team-grid, .toolbox-grid { grid-template-columns: 1fr !important; }
          .idea-card { width: 100% !important; }
          .modal-card { padding: 16px !important; }
          .proj-select { width: 100% !important; }
          .proj-row { flex-direction: column; align-items: stretch !important; }
          .proj-row-actions { justify-content: flex-end; }
          .header-logo { height: 48px !important; }
        }
        @media (min-width: 900px) {
          .header-logo { height: 80px !important; }
        }
        select, input, textarea, button { font-family: Arial, Helvetica, sans-serif; }
        select, input, textarea { font-size: 16px; }
        @media (min-width: 641px) {
          select, input, textarea { font-size: 13.5px; }
        }
        select:focus, input:focus, textarea:focus, button:focus-visible {
          outline: 2px solid ${COLORS.orange}; outline-offset: 1px;
        }
        img, svg { max-width: 100%; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        * { box-sizing: border-box; }
      `}</style>

      <Header tab={tab} setTab={setTab} tabs={TABS} />

      <main className="app-main" style={{ maxWidth: 1100, margin: "0 auto", padding: "24px 28px", overflowX: "hidden" }}>
        {tab === "ai" && <AIGuideTab />}
        {tab === "team" && (
          <TeamTab
            projects={projectsStore.items}
            team={team}
            saveTeam={teamStore.save}
            loading={teamStore.loading}
            error={teamStore.error}
            reload={teamStore.reload}
          />
        )}
        {tab === "projects" && (
          <ProjectsTab
            ideas={ideasStore.items}
            saveIdeas={ideasStore.save}
            ideasLoading={ideasStore.loading}
            ideasError={ideasStore.error}
            reloadIdeas={ideasStore.reload}
            projects={projectsStore.items}
            saveProjects={projectsStore.save}
            projectsLoading={projectsStore.loading}
            projectsError={projectsStore.error}
            reloadProjects={projectsStore.reload}
            team={team}
            onSendToToolbox={sendProjectToToolbox}
          />
        )}
        {tab === "toolbox" && (
          <ToolboxTab
            tools={toolboxStore.items}
            saveTools={toolboxStore.save}
            completedProjects={projectsStore.items.filter((p) => p.status === "Complete")}
            loading={toolboxStore.loading}
            error={toolboxStore.error}
            reload={toolboxStore.reload}
          />
        )}
      </main>

      <footer style={{
        textAlign: "center", padding: "18px 20px 28px", fontSize: 11.5,
        color: COLORS.gray300,
      }}>
        Sales Tool Box · Canada Victaulic Team · Internal use
      </footer>
    </div>
  );
}

/* ------------------------------ Password gate ------------------------------
   Simple front-door check so the site isn't wide open to search engines or
   randoms with the link. This runs entirely in the browser, so it's a light
   deterrent for an internal team tool — not real security. Anyone determined
   enough to view the page source can find the password.
---------------------------------------------------------------------------- */

const SITE_PASSWORD = "canvictaulic26";
const UNLOCK_KEY = "yvr-pha-toolbox-unlocked";

function PasswordGate() {
  const [unlocked, setUnlocked] = useState(
    () => localStorage.getItem(UNLOCK_KEY) === "true"
  );
  const [input, setInput] = useState("");
  const [error, setError] = useState(false);

  const submit = () => {
    if (input.trim().toLowerCase() === SITE_PASSWORD) {
      localStorage.setItem(UNLOCK_KEY, "true");
      setUnlocked(true);
      setError(false);
    } else {
      setError(true);
    }
  };

  if (unlocked) return <App />;

  return (
    <div style={{
      minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: "#F5F5F4", fontFamily: "Arial, Helvetica, sans-serif", padding: 20,
    }}>
      <div
        style={{
          background: "#FFFFFF", border: "1px solid #D9D9D6", borderRadius: 8,
          padding: "32px 28px", width: "100%", maxWidth: 340,
          display: "flex", flexDirection: "column", gap: 14, alignItems: "center",
        }}
      >
        <img src={LOGO_SRC} alt="Victaulic" style={{ height: 58, marginBottom: 6, maxWidth: "100%" }} />
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", color: "#53565A", textTransform: "uppercase" }}>
          Canada Victaulic Team
        </div>
        <div style={{ fontWeight: 800, fontSize: 16, color: "#000000", textAlign: "center", marginTop: -6 }}>
          Sales Tool Box
        </div>
        <div style={{ fontSize: 12.5, color: "#53565A", textAlign: "center", marginBottom: 4 }}>
          Enter the team password to continue.
        </div>
        <input
          type="password"
          autoFocus
          value={input}
          onChange={(e) => { setInput(e.target.value); setError(false); }}
          onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
          placeholder="Password"
          style={{
            width: "100%", boxSizing: "border-box", padding: "10px 12px",
            border: `1px solid ${error ? "#B3261E" : "#D9D9D6"}`, borderRadius: 5,
            fontSize: 16, fontFamily: "Arial, Helvetica, sans-serif", outline: "none",
          }}
        />
        {error && (
          <div style={{ fontSize: 12, color: "#B3261E" }}>
            That's not it — try again.
          </div>
        )}
        <button
          type="button"
          onClick={submit}
          style={{
            width: "100%", background: "#F58220", color: "#FFFFFF", border: "none",
            borderRadius: 5, padding: "10px 16px", fontWeight: 700, fontSize: 13.5,
            cursor: "pointer", fontFamily: "Arial, Helvetica, sans-serif",
          }}
        >
          Enter
        </button>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<PasswordGate />);

</script>
